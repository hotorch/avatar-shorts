name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # 머리 추적 시험(face.py)용 얼굴 인식만 (음성 인식 패키지는 무거워서 뺀다)
      - run: python3 -m venv .venv && .venv/bin/pip install -q "opencv-python-headless>=4.8,<5" "numpy>=1.24"
      # 음성 인식·렌더 없이: 타입, 정책↔코드 일치, 머리 배치·추적, 말 편집(합성 소리), 검사기 회귀
      - run: npm test -- --quick
