name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # 음성 인식·렌더 없이: 타입, 정책↔코드 일치, 말 편집(합성 소리), 검사기 회귀
      - run: npm test -- --quick
